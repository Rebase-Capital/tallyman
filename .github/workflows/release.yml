name: Release

# Merging a version bump publishes the gem. When tallyman.gemspec changes on main and its version
# is not on RubyGems yet, this workflow pushes it and creates the GitHub release and tag from the
# version's changelog entry. A gemspec change that keeps the version (a dependency bump, say)
# finds it already published and stops there, without failing.
#
# There is no API key anywhere. RubyGems trusted publishing signs for the gem, and it trusts
# this workflow in this repository and nothing else.
on:
  push:
    branches: [main]
    paths:
      - "tallyman.gemspec"
  # A release that failed on something unrelated should not need a fake version bump to ride
  # in on.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Read the version from the gemspec
        id: version
        run: |
          version=$(ruby -e 'print Gem::Specification.load("tallyman.gemspec").version')
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      # RubyGems does not let a version number be reused, so a version that is already out is
      # never pushed again.
      - name: Check whether this version is already published
        id: published
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gem list --remote --exact tallyman --all | grep -q "\b${VERSION}\b"; then
            echo "tallyman ${VERSION} is already on RubyGems; nothing to release."
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # The suite runs again here rather than trusting the pull request's run, because what
      # ships is this commit, not the one that was reviewed.
      - if: steps.published.outputs.value == 'false'
        run: bundle exec rspec
      - if: steps.published.outputs.value == 'false'
        run: bundle exec rubocop --format github

      # Exchanges this run's OIDC token for a short-lived RubyGems credential.
      #
      # This is what rubygems/configure-rubygems-credentials does, done by hand for one reason:
      # RubyGems only lets a pending trusted publisher create a gem that does not exist yet when
      # the exchange names the account that will own it, and that action (v2.1.0) has no way to
      # send the `owner` parameter. The owner comes from the RUBYGEMS_OWNER repository variable,
      # a RubyGems handle or account ID. It only matters for the very first push; once the gem
      # exists the variable can be removed, and this step swapped back for the action.
      - name: Get a RubyGems credential
        if: steps.published.outputs.value == 'false'
        shell: bash
        env:
          OWNER: ${{ vars.RUBYGEMS_OWNER }}
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r '.value')
          echo "::add-mask::${jwt}"

          body=$(jq -n --arg jwt "${jwt}" --arg owner "${OWNER}" \
            '{jwt: $jwt} + (if $owner == "" then {} else {owner: $owner} end)')
          response=$(curl -sS -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "${body}" https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)

          key=$(jq -r '.rubygems_api_key // empty' <<< "${response}")
          if [ -z "${key}" ]; then
            echo "RubyGems refused the token exchange: ${response}" >&2
            exit 1
          fi
          echo "::add-mask::${key}"
          echo "GEM_HOST_API_KEY=${key}" >> "${GITHUB_ENV}"

      - name: Build and push the gem
        if: steps.published.outputs.value == 'false'
        run: |
          gem build tallyman.gemspec
          gem push "tallyman-${{ steps.version.outputs.value }}.gem"

      - name: Wait for the release to propagate
        if: steps.published.outputs.value == 'false'
        run: gem exec rubygems-await "tallyman-${{ steps.version.outputs.value }}.gem"

      # The notes are the version's changelog entry, so the release page and the changelog
      # cannot drift apart. Tags carry no "v", like the earlier ones.
      - name: Create the GitHub release
        if: steps.published.outputs.value == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          notes=$(ruby -e '
            changelog = File.read("CHANGELOG.md")
            print changelog[/^## #{Regexp.escape(ENV.fetch("VERSION"))}\b.*?(?=\n## |\z)/m].to_s.strip
          ')
          gh release create "${VERSION}" --target "${GITHUB_SHA}" --title "${VERSION}" --notes "${notes}"
